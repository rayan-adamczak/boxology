  <!DOCTYPE html>
  <html lang="fr">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>jaquette.app, le catalogue des éditions Blu-ray et 4K françaises</title>
      <meta name="description" content="Retrouvez toutes les éditions physiques d’un film : steelbook, coffret collector, 4K, digibook. Comparez formats et contenus, et gardez la trace de votre collection." />

      <!--
        Ni canonical ni og:url ici : ce fichier sert les 2 227 fiches films comme
        la page d'accueil. Une valeur en dur pointerait chaque fiche vers la
        racine et les ferait passer pour des doublons. Les deux sont posés au
        rendu par useSeo (src/app/lib/seo.ts), à partir de l'URL réelle. En
        l'absence de canonical, un crawler retient l'URL demandée, le bon repli.
      -->

      <!--
        Icônes. Le site n'en déclarait aucune : le navigateur demandait
        /favicon.ico, que la réécriture SPA servait en HTML avec un code 200,
        donc un onglet sans icône plutôt qu'un 404 franc.

        Trois fichiers et pas un de plus :
          favicon.svg          la source, un seul fichier pour toutes les
                               tailles, y compris les écrans à forte densité ;
          favicon-96.png       le repli des navigateurs qui ignorent le SVG ;
          apple-touch-icon.png 180 px, ce qu'iOS pose sur l'écran d'accueil. Le
                               fichier est carré et sans arrondi, le système
                               masque lui-même, et un double arrondi se voit.

        Pas de `manifest.json` : il ne servirait qu'à l'installation en
        application, qui n'est pas un chantier ouvert.
      -->
      <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
      <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <!-- Bandeau du navigateur sur mobile, aligné sur --reel-bg. -->
      <meta name="theme-color" content="#101720" />

      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="jaquette.app" />
      <meta property="og:locale" content="fr_FR" />
      <meta property="og:title" content="jaquette.app, le catalogue des éditions Blu-ray et 4K françaises" />
      <meta property="og:description" content="Retrouvez toutes les éditions physiques d’un film : steelbook, coffret collector, 4K, digibook. Comparez formats et contenus, et gardez la trace de votre collection." />
      <meta name="twitter:card" content="summary_large_image" />

      <!--
        Visuel de partage par défaut. `twitter:card` promettait une grande image
        depuis le début sans qu'aucune ne soit déclarée : tout partage de
        l'accueil, de /bienvenue ou d'une page de regroupement sortait sans
        visuel.

        En URL absolue, c'est une exigence d'Open Graph et non un excès de
        prudence : les scrapers ne résolvent pas les chemins relatifs.

        Les fiches films **remplacent** ce contenu par leur affiche, elles ne
        l'ajoutent pas (cf. `functions/_middleware.ts`) : deux `og:image` sur la
        même page laisseraient chaque scraper choisir, et ils ne choisissent pas
        tous pareil. Les dimensions sont réécrites avec, l'affiche TMDB étant en
        500×750 et non en 1200×630.

        Fabriquée par `scripts/og/og-jaquette.html`, rendu par Chrome sans
        interface. Le fichier source est gardé pour pouvoir la refaire ; une
        capture d'écran, elle, aurait vieilli à la première retouche.
      -->
      <meta property="og:image" content="https://jaquette.app/og-jaquette.jpg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="jaquette.app, le catalogue des éditions physiques de films" />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!--
      Les polices sont auto-hébergées depuis juillet 2026, déclarations dans
      `src/styles/fonts.css`. Plus aucun domaine tiers, donc plus de résolution
      DNS ni de poignée de main TLS avant le premier glyphe.

      `preload` et non `preconnect` : le fichier est sur notre origine, dont la
      connexion est déjà ouverte, mais le CSS qui le référence est un bundle
      hashé que le navigateur doit d'abord télécharger et parser. Le `preload`
      lance la police en parallèle, dès la lecture de ce `<head>`.

      Seul le sous-ensemble `latin` est préchargé : c'est celui dont un visiteur
      français a besoin. `latin-ext` reste déclaré dans le CSS et n'est cherché
      que si un caractère l'exige. Précharger les deux ferait payer 116 Ko à
      tout le monde pour un usage rare.

      `crossorigin` est obligatoire même en même origine : une police est
      toujours demandée en mode CORS, et sans cet attribut le préchargement ne
      correspond à rien, le fichier est retéléchargé une seconde fois.
    -->
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    </head>

    <body>

      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>

    </body>
  </html>
