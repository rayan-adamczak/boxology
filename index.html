  <!DOCTYPE html>
  <html lang="fr">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>jaquette.app — Le catalogue des éditions Blu-ray et 4K françaises</title>
      <meta name="description" content="Retrouvez toutes les éditions physiques d’un film : steelbook, coffret collector, 4K, digibook. Comparez formats et contenus, et gardez la trace de votre collection." />

      <!--
        Ni canonical ni og:url ici : ce fichier sert les 2 227 fiches films comme
        la page d'accueil. Une valeur en dur pointerait chaque fiche vers la
        racine et les ferait passer pour des doublons. Les deux sont posés au
        rendu par useSeo (src/app/lib/seo.ts), à partir de l'URL réelle. En
        l'absence de canonical, un crawler retient l'URL demandée — le bon repli.
      -->

      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="jaquette.app" />
      <meta property="og:locale" content="fr_FR" />
      <meta property="og:title" content="jaquette.app — Le catalogue des éditions Blu-ray et 4K françaises" />
      <meta property="og:description" content="Retrouvez toutes les éditions physiques d’un film : steelbook, coffret collector, 4K, digibook. Comparez formats et contenus, et gardez la trace de votre collection." />
      <meta name="twitter:card" content="summary_large_image" />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!--
      Bricolage Grotesque porte les titres et le mot-symbole. `preconnect` évite
      d'attendre la poignée de main TLS au moment où la police est demandée, et
      `display=swap` affiche le texte en police système plutôt que de le laisser
      invisible pendant le téléchargement.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    </head>

    <body>

      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>

    </body>
  </html>
