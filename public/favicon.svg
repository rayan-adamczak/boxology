  <!--
    Mot-symbole sur tuile sombre, tel que dessiné dans Figma (node 54:145) : le
    « j » blanc n'existe pas sur fond clair, donc l'icône porte son propre fond
    plutôt que de compter sur celui de l'onglet.

    #14181c est la valeur du dessin, un cran plus sombre que le --reel-bg du
    site (#101720) : c'est voulu, une icône de 16 px lue à côté d'un favicon
    blanc gagne à être franchement sombre.

    Le rayon vaut 44, soit 22 % du côté : les surfaces qui masquent l'icône
    (iOS, Android) rognent par-dessus sans que le tracé n'en souffre.
  -->
