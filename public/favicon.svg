<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="jaquette.app">
  <!--
    Mot-symbole sur tuile sombre, tel que dessiné dans Figma (node 54:145), au
    « j » blanc près, retiré le 3 août 2026.

    Le fond est le dégradé vertical du dessin, et non un aplat : trois stops
    relevés au pixel sur l'export PNG du node plutôt que recomposés depuis les
    valeurs semi-transparentes de Figma, qui supposent un fond de calque.

      haut  #191B1D      60 %  #15181B      bas  #13171B

    Carré, sans arrondi, comme le node : les surfaces qui masquent l'icône
    (iOS, Android) rognent elles-mêmes, et un double arrondi se voit.

    Le motif est **recentré et remis à l'échelle**, il ne garde pas la position
    de l'ancien dessin : sans le « j » blanc il occupait la moitié droite de la
    tuile. Hauteur portée à 135 sur 200, soit 67 % du côté, la même proportion
    qu'avant. La transformation se lit de droite à gauche : on ramène le coin
    du motif à l'origine, on met à l'échelle, on replace.

    Les tranches sont espacées de 3,6 unités de plus chacune, gouttière portée
    de 6,4 à 10. Le motif s'élargit donc de 7,2, et le recentrage a suivi,
    39,93 au lieu de 44,28 : oublier ce report laisserait la tuile déséquilibrée
    vers la droite sans que rien ne le signale.
  -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191B1D"/>
      <stop offset="0.6" stop-color="#15181B"/>
      <stop offset="1" stop-color="#13171B"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#fond)"/>
  <g transform="translate(39.93 32.5) scale(1.2066) translate(-28.5596 -33.7028)">
    <path transform="translate(7.2)" fill="#FB4412" d="M91.5269 145.583C90.9114 145.583 90.2445 145.531 89.5263 145.429C88.9107 145.429 88.2439 145.326 87.5257 145.121L85.679 126.192C90.3984 126.192 93.7327 125.423 95.682 123.884C97.7339 122.345 98.7599 119.267 98.7599 114.65V33.7028H120.92V115.266C120.92 120.601 120.254 125.166 118.92 128.962C117.689 132.861 115.842 135.99 113.38 138.35C110.917 140.812 107.84 142.607 104.146 143.736C100.555 144.967 96.3489 145.583 91.5269 145.583Z"/>
