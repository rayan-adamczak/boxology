  <!--
    Mot-symbole seul, fond transparent. Trois « j » lus comme les tranches d'une
    étagère : cyan, ambre, rouge. Exporté depuis Figma (node 54:145), les
    couleurs sont en dur et non en jetons du thème : un logo ne suit pas la
    couleur d'accent du site.

    Le « j » blanc de tête a été retiré le 3 août 2026. Il portait le seul point
    du dessin, d'où un `viewBox` recadré sur les fûts : garder l'ancien aurait
    laissé du vide à gauche et en haut, donc un motif décalé dans sa boîte.

    La version sur tuile sombre est public/favicon.svg, qui reprend ces mêmes
    tracés. Toute retouche vaut pour les deux fichiers et pour
    src/app/components/Logo.tsx, qui les redit en JSX faute de pouvoir colorer
    un <img> à l'écran.
