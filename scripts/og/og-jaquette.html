<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    font-weight: 200 800;
    src: url('../../public/fonts/bricolage-grotesque-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter';
    font-weight: 400 700;
    src: url('../../public/fonts/inter-latin.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #101720;
    color: #e8e8e8;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 84px;
    position: relative;
    overflow: hidden;
  }
  /* Deux halos bleu nuit, même traitement que le héros du site : l'atmosphère
     vient de l'opacité et du dégradé, jamais d'un filtre. */
  .halo {
    position: absolute;
    border-radius: 50%;
    filter: blur(0);
  }
  .halo-a {
    width: 900px; height: 900px;
    right: -260px; top: -320px;
    background: radial-gradient(circle, rgba(31,95,208,.34) 0%, rgba(31,95,208,0) 62%);
  }
  .halo-b {
    width: 700px; height: 700px;
    left: -240px; bottom: -300px;
    background: radial-gradient(circle, rgba(110,168,255,.18) 0%, rgba(110,168,255,0) 64%);
  }
  .contenu { position: relative; z-index: 1; }
  /* Mot-symbole et nom sur la même ligne, comme dans le bandeau du site : c'est
     le seul verrou contre deux lockups différents, l'un à l'écran et l'autre en
     partage. Les tracés sont ceux de public/logo.svg, recopiés parce que ce
     fichier est rendu par Chrome hors de tout serveur. */
  .lockup { display: flex; align-items: center; gap: 20px; }
  .lockup svg { display: block; height: 68px; width: auto; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 96px;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  p.accroche {
    font-size: 34px;
    line-height: 1.34;
    color: #e8e8e8;
    margin-top: 30px;
    max-width: 900px;
  }
  p.accroche b { font-weight: 600; color: #6ea8ff; }
  /* Points médians et non capsules : la capsule est réservée à ce qui se
     clique (§8). Sur une image, rien ne se clique. */
  p.formats {
    font-size: 24px;
    color: #8a8f98;
    margin-top: 40px;
    letter-spacing: 0.01em;
  }
  .filet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 8px;
    background: linear-gradient(90deg, #1f5fd0 0%, #6ea8ff 100%);
  }
</style>
</head>
<body>
  <div class="halo halo-a"></div>
  <div class="halo halo-b"></div>

  <div class="contenu">
    <div class="lockup">
      <svg viewBox="28.5596 33.7028 99.5604 111.8802" xmlns="http://www.w3.org/2000/svg">

        <path transform="translate(3.6)" fill="#FFB000" d="M62.9672 145.583C62.3517 145.583 61.6848 145.531 60.9666 145.429C60.3511 145.429 59.6842 145.326 58.966 145.121L57.1193 126.192C61.8387 126.192 65.173 125.423 67.1223 123.884C69.1742 122.345 70.2002 119.267 70.2002 114.65V33.7028H92.3607V115.266C92.3607 120.601 91.6938 125.166 90.3601 128.962C89.129 132.861 87.2823 135.99 84.82 138.35C82.3577 140.812 79.2798 142.607 75.5864 143.736C71.9956 144.967 67.7892 145.583 62.9672 145.583Z"/>
        <path fill="#00BCED" d="M34.4075 145.583C33.792 145.583 33.1251 145.531 32.4069 145.429C31.7914 145.429 31.1245 145.326 30.4063 145.121L28.5596 126.192C33.279 126.192 36.6133 125.423 38.5626 123.884C40.6145 122.345 41.6405 119.267 41.6405 114.65V33.7028H63.801V115.266C63.801 120.601 63.1342 125.166 61.8004 128.962C60.5693 132.861 58.7226 135.99 56.2603 138.35C53.798 140.812 50.7201 142.607 47.0267 143.736C43.4359 144.967 39.2295 145.583 34.4075 145.583Z"/>
      </svg>
      <h1>jaquette.app</h1>
    </div>
    <p class="accroche">
      Le catalogue des éditions physiques de films.<br />
      <b>15 000 éditions</b> recensées pour le marché français.
    </p>
    <p class="formats">Blu-ray · 4K · Steelbooks · Coffrets · Digibooks</p>
  </div>

  <div class="filet"></div>
</body>
</html>
